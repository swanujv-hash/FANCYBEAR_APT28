<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeepTrace — Cyber Cell Investigation Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceff3;--panel:#fff;--ink:#16202c;--mut:#586577;--line:#cfd6df;--pri:#1b5e8f;--amb:#8a4b00;--ambb:#fdf0d5;--amline:#d98e04;--red:#9b1c1c;--redline:#c62828;--ok:#216e39}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'IBM Plex Sans',system-ui,sans-serif}header{position:sticky;top:0;z-index:5;background:#0b2545;color:#fff;padding:9px 16px;display:flex;align-items:center;gap:16px}header b{font-size:19px}nav{display:flex;gap:4px;overflow-x:auto;margin-left:auto}nav button{background:transparent;border:0;color:#c9d6e6;padding:7px 10px;border-radius:4px;cursor:pointer;font:inherit;font-size:13px;white-space:nowrap}nav button.on{background:#ffffff26;color:#fff;font-weight:600}nav button:disabled{opacity:.4;cursor:default}main{max-width:920px;margin:0 auto;padding:22px 16px 28px}footer{max-width:920px;margin:0 auto;padding:0 16px 24px;color:var(--mut);font-size:12px}h1{margin:0 0 2px;font-size:24px}h2{margin:0 0 6px;font-size:16px}h3{margin:14px 0 2px;font-size:14px;color:var(--mut)}.sub{color:var(--mut);margin:0 0 14px}.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:18px}.narrow{max-width:500px}label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit}.btn{background:var(--pri);color:#fff;border:1px solid var(--pri);border-radius:4px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}.btn.alt{background:transparent;color:var(--pri)}.btn:disabled{opacity:.55;cursor:default}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.err{color:var(--red);font-weight:600;margin:10px 0}.ok{color:var(--ok);font-weight:600}.drop{border:2px dashed var(--line);border-radius:4px;padding:34px 16px;text-align:center;margin-bottom:14px}.drop.over{border-color:var(--pri);background:var(--bg)}.drop p{margin:0 0 6px}dl{margin:8px 0;display:grid;grid-template-columns:auto 1fr;gap:4px 18px}dt{color:var(--mut)}dd{margin:0;font-weight:600;word-break:break-all}.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-bottom:18px}.mod{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--amline);border-radius:4px;padding:16px}.mod.alert,.mod.possible_anomaly{border-left-color:var(--redline)}.mod.not_implemented{border-left-color:var(--line)}.st{font-weight:600;margin:0 0 8px}.mod.review .st{color:var(--amb)}.mod.alert .st,.mod.possible_anomaly .st{color:var(--red)}.mod.not_implemented .st{color:var(--mut)}.mod p{margin:0 0 8px}.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--pri)}.gauge{position:relative;height:20px;margin:40px 0 4px;border:1px solid var(--line);background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 10%)}.gauge span{position:absolute;top:-8px;bottom:-8px;width:4px;background:var(--pri);transform:translate(-50%)}.gauge b{position:absolute;bottom:100%;left:50%;transform:translate(-50%);font-size:26px}.scale{display:flex;justify-content:space-between;color:var(--mut);font-size:12px}.warn{background:var(--ambb);color:var(--amb);border-left:5px solid var(--amline);padding:10px 14px;font-weight:700;margin:12px 0}.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0 14px}.tabs button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}.tabs button.on{border-color:var(--pri);font-weight:700;color:var(--pri)}.big{display:grid;gap:12px;margin-bottom:16px}.big-b{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:22px 20px;text-align:left;font-size:17px}.big-b span{font-weight:400;font-size:13px}.preview{max-width:100%;max-height:320px;border:1px solid var(--line);border-radius:4px;margin-top:12px}pre{white-space:pre-wrap;overflow:auto;margin:8px 0;font:13px/1.5 'IBM Plex Mono',monospace;background:#f7f8fa;padding:12px;border:1px solid var(--line);border-radius:4px}.small{font-size:12px;color:var(--mut)}
.report-document{background:#fff;border:1px solid var(--line);border-radius:4px;padding:24px;margin-top:18px;box-shadow:0 1px 2px #0000000b}.report-header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:18px}.report-kicker{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--mut);margin-bottom:4px}.report-header h2{font-size:22px;margin:0}.report-header p{margin:3px 0 0;color:var(--mut);font-size:12px}.report-score{min-width:90px;text-align:center;border:1px solid var(--line);padding:8px 12px}.report-score span{display:block;color:var(--mut);font-size:11px}.report-score b{font-size:26px}.report-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:18px 0}.report-grid>div{background:#f7f8fa;border:1px solid var(--line);padding:10px}.report-grid label{margin:0 0 3px;font-size:11px;color:var(--mut)}.report-grid strong{display:block;word-break:break-word}.hash{font-size:11px}.report-findings{display:grid;gap:10px}.report-card{border:1px solid var(--line);border-left:4px solid var(--pri);padding:12px;background:#fbfcfd}.report-card-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.report-card h3{margin:0;color:var(--ink);font-size:14px}.report-card p{margin:5px 0 0}.report-status{font-size:11px;font-weight:700;border:1px solid var(--line);padding:2px 7px;white-space:nowrap}.report-note{margin-top:16px;padding:12px 14px;background:var(--ambb);border-left:4px solid var(--amline)}.report-section{margin:18px 0}.report-list{padding-left:22px}.report-list li{margin:9px 0}.big-b.on{box-shadow:inset 4px 0 0 var(--pri)}.detector-result{margin-bottom:18px;padding:20px;background:#fff;border:2px solid var(--pri);border-radius:4px}.detector-result .eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--mut)}.detector-result .verdict{font-size:24px;font-weight:700;margin:4px 0}.detector-result .score{font-size:42px;font-weight:700}.detector-result .meter{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:8px 0 10px}.detector-result .meter i{display:block;height:100%;background:var(--pri)}.detector-result.review{border-color:var(--amline)}.detector-result.alert{border-color:var(--redline)}.external-verify{margin-top:18px;padding:14px 16px;border:1px solid var(--line);background:#f7f8fa;border-left:4px solid var(--pri)}.external-verify h3{margin:0 0 6px}.external-verify p{margin:5px 0}.external-verify .btn{margin-top:8px}
</style></head>
<body>
<header><b>DeepTrace</b><nav id="nav"></nav></header>
<main id="app"></main><footer>DeepTrace prototype · Automated indicators are screening aids, not a final authenticity determination. API: <span class="mono" id="apiBase"></span></footer>
<script>
const API = new URLSearchParams(location.search).get('api') || (location.protocol === 'file:' ? 'http://127.0.0.1:8000' : location.origin);
const EXTERNAL_DETECTOR_URL='https://zinc.cse.buffalo.edu/ubmdfl/deep-o-meter/';
const API_BASE = API.replace(/\/$/, '');
const state={step:0,reached:0,officer:{name:'',dept:''},caseInfo:{title:'Suspected Deepfake',type:'Video'},file:null,evidence:null,analysis:null,report:null,activeModule:0,error:''};
const steps=['Officer','Case','Evidence','Analysis','Findings','Reports'];
const allowed={Video:['mp4','mov','avi','mkv','webm'],Audio:['mp3','wav'],Image:['jpg','jpeg','png']};
const $=s=>document.querySelector(s);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setError(e){state.error=e?.message||String(e);render();}
async function api(path,opt={}){const r=await fetch(API_BASE+path,opt);let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.detail||`Request failed (${r.status})`);return data}
function go(n){state.step=n;state.reached=Math.max(state.reached,n);state.error='';window.scrollTo(0,0);render()}
function renderNav(){ $('#nav').innerHTML=steps.map((s,i)=>`<button class="${i===state.step?'on':''}" ${i>state.reached?'disabled':''} data-nav="${i}">${i+1}. ${s}</button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(+b.dataset.nav)); }
function render(){const apiEl=document.querySelector('#apiBase');if(apiEl)apiEl.textContent=API_BASE;renderNav();const views=[officerView,caseView,evidenceView,analysisView,findingsView,reportsView];$('#app').innerHTML=views[state.step]();wire();}
function officerView(){return `<h1>Officer sign-in</h1><p class="sub">Identify yourself before opening a case.</p><section class="panel narrow"><label>Officer name</label><input id="officer" value="${esc(state.officer.name)}"><label>Cyber-cell / department</label><input id="dept" value="${esc(state.officer.dept)}"><div class="row"><button class="btn" id="start">Start new case</button></div>${state.error?`<p class="err">${esc(state.error)}</p>`:''}</section>`}
function caseView(){return `<h1>Create case</h1><p class="sub">These details are sent to the DeepTrace backend and appear on reports.</p><section class="panel narrow"><label>Case title</label><input id="title" value="${esc(state.caseInfo.title)}"><label>Officer name</label><input id="caseOfficer" value="${esc(state.officer.name)}"><label>Date</label><input id="date" type="date" value="${state.caseInfo.date||new Date().toISOString().slice(0,10)}"><label>Evidence type</label><select id="type">${Object.keys(allowed).map(x=>`<option ${state.caseInfo.type===x?'selected':''}>${x}</option>`).join('')}</select><div class="row"><button class="btn" id="create">Create case</button></div>${state.error?`<p class="err">${esc(state.error)}</p>`:''}</section>`}
function evidenceView(){let f=state.file;return `<h1>Upload digital evidence</h1><p class="sub">Upload the original media file. The backend stores it and calculates a SHA-256 integrity reference.</p><section class="panel"><div class="drop" id="drop"><p><b>Drag and drop ${state.caseInfo.type.toLowerCase()} evidence here</b></p><p class="small">or choose a file from your computer</p><input id="file" type="file" accept=".${allowed[state.caseInfo.type].join(',.')}"></div>${f?`<h2>Selected evidence</h2><dl><dt>File</dt><dd>${esc(f.name)}</dd><dt>Size</dt><dd>${(f.size/1048576).toFixed(2)} MB</dd></dl>${f.type.startsWith('video/')?`<video class="preview" controls src="${URL.createObjectURL(f)}"></video>`:''}<div class="external-verify"><h3>Independent external verification</h3><p>DeepTrace itself runs a real ML deepfake detector after you click Upload and analyze. You do not need to manually upload the file to another website for the primary result.</p><p class="small">For an independent second opinion, you can still upload the same evidence to the University at Buffalo DeepFake-O-Meter.</p><a class="btn alt" href="${EXTERNAL_DETECTOR_URL}" target="_blank" rel="noopener noreferrer">Open DeepFake-O-Meter ↗</a></div>`:''}<div class="row"><button class="btn" id="upload" ${!f||state.busy?'disabled':''}>${state.busy?'Uploading…':'Upload and analyze'}</button></div>${state.error?`<p class="err">${esc(state.error)}</p>`:''}</section>`}
function moduleData(){if(!state.analysis)return[];const a=state.analysis;return [['ml_detector','ML deepfake detector',a.ml_detector],['metadata','Metadata analysis',a.metadata],['compression','Compression analysis',a.compression],['facial_landmarks','Facial feature analysis',a.facial_landmarks],['audio_lip_sync','Audio-lip synchronization',a.audio_lip_sync]].filter(x=>x[2])}
function statusLabel(x){return ({alert:'Anomaly detected',possible_anomaly:'Possible anomaly',review:'Review required',normal:'No anomaly signal',not_implemented:'Not implemented',not_available:'Not available',not_applicable:'Not applicable',error:'Analysis error'})[x]||x||'Unknown'}
function detectorResult(d){
 if(!d)return '';
 const score=Number(d.model_score);
 if(!Number.isFinite(score)) return `<section class="detector-result review"><div class="eyebrow">MODEL DETECTOR</div><div class="verdict">Detector unavailable</div><p>${esc(d.error||d.observation||'The ML detector did not return a result.')}</p><p class="small">No fake/real conclusion was made.</p></section>`;
 const verdict=d.verdict==='possible_deepfake'?'LIKELY AI-MANIPULATED / DEEPFAKE SIGNAL':'NO STRONG AI-GENERATION SIGNAL';
 const cls=d.verdict==='possible_deepfake'?'alert':'review';
 return `<section class="detector-result ${cls}"><div class="eyebrow">PRIMARY ML DEEPFAKE DETECTOR</div><div class="verdict">${verdict}</div><div class="score">${score.toFixed(2)}%</div><div class="meter"><i style="width:${Math.min(100,Math.max(0,score))}%"></i></div><p><b>Model:</b> ${esc(d.model||'Deepfake detector')}</p><p>${esc(d.observation||'')}</p><p class="small"><b>Important:</b> ${esc(d.significance||'This is a probabilistic screening result, not proof of authenticity.')}</p></section>`;
}
function analysisView(){if(!state.analysis)return `<h1>Deepfake analysis</h1><section class="panel"><p>No analysis is available yet.</p></section>`;return `<h1>Deepfake analysis</h1><p class="sub">Live results returned by the DeepTrace backend. The ML detector actually evaluates the uploaded media; the other modules provide supporting forensic signals.</p>${detectorResult(state.analysis.ml_detector)}<section class="panel"><h2>Investigation priority score</h2><div class="gauge"><span style="left:${Math.min(100,Number(state.analysis.priority_score)||0)}%"></span><b>${esc(state.analysis.priority_score)}</b></div><div class="scale"><span>0 (routine)</span><span>100 (review first)</span></div><p>The priority score combines the ML screening signal with metadata, compression, facial and audio-lip checks. It is not a probability of being fake.</p><p class="warn">⚠ Human review required for consequential decisions</p></section><div class="grid">${moduleData().map(([id,n,d])=>`<article class="mod ${esc(d.status)}"><h2>${n}</h2><p class="st">${statusLabel(d.status)}</p><p>${esc(d.observation||d.finding||'')}</p>${d.confidence!=null?`<p class="small">Confidence: ${esc(d.confidence)}%</p><div class="bar"><i style="width:${Math.min(100,Number(d.confidence)||0)}%"></i></div>`:''}<div class="row"><button class="btn alt" data-module="${id}">View details</button></div></article>`).join('')}</div><div class="external-verify"><h3>Independent reference</h3><p>The detector model is the corrected Community Forensics ViT-Small, hosted publicly on Hugging Face. DeepTrace downloads the model once and then runs inference locally through ONNX Runtime.</p><a class="btn alt" href="https://huggingface.co/buildborderless/CommunityForensics-DeepfakeDet-ViT" target="_blank" rel="noopener noreferrer">View detector model ↗</a></div><div class="row"><button class="btn" id="findings">View detailed findings</button><button class="btn alt" id="reports">Go to reports</button></div>`}
function findingsView(){const mods=moduleData();if(!mods.length)return '<h1>Detailed findings</h1><section class="panel">No findings available.</section>';const [id,n,d]=mods[state.activeModule]||mods[0];return `<h1>Detailed findings</h1><p class="sub">Evidence-level observations returned by the analysis pipeline.</p><div class="tabs">${mods.map((m,i)=>`<button class="${i===state.activeModule?'on':''}" data-tab="${i}">${m[1]}</button>`).join('')}</div><section class="panel"><h2>${n}</h2><p class="st">${statusLabel(d.status)}</p><dl>${Object.entries(d).filter(([k])=>!['status','observation','significance','limitations','confidence'].includes(k)).map(([k,v])=>`<dt>${k.replaceAll('_',' ')}</dt><dd>${typeof v==='object'?esc(JSON.stringify(v)):esc(v)}</dd>`).join('')}</dl><h3>Observation</h3><p>${esc(d.observation||'—')}</p><h3>Significance</h3><p>${esc(d.significance||'—')}</p><h3>Limitations</h3><p>${esc(d.limitations||d.limitation||'—')}</p></section><div class="row"><button class="btn alt" id="backAnalysis">Back to analysis</button><button class="btn" id="reports">Go to reports</button></div>`}
function reportTypeLabel(t){return ({evidence_summary:'Evidence Summary',investigation_brief:'Investigation Brief',victim_guide:'Victim Guidance'})[t]||'Investigation Report'}
function reportFindingRows(findings){
 const arr=Array.isArray(findings)?findings:Object.entries(findings||{}).map(([module,value])=>({module, ...(value||{})}));
 return arr.map(item=>{const status=statusLabel(item.status);const measurements=item.measurements||{};const measurementRows=Object.entries(measurements).filter(([k])=>k!=='method').map(([k,v])=>`<div><label>${esc(k.replaceAll('_',' '))}</label><strong>${typeof v==='object'?esc(JSON.stringify(v)):esc(v)}</strong></div>`).join('');return `<article class="report-card"><div class="report-card-head"><h3>${esc(item.module)}</h3><span class="report-status">${esc(status)}</span></div><p>${esc(item.observation||'No observation recorded.')}</p>${item.confidence!=null?`<p class="small">Confidence: ${esc(item.confidence)}%</p>`:''}${item.significance?`<p class="small"><b>Significance:</b> ${esc(item.significance)}</p>`:''}${measurementRows?`<div class="report-grid">${measurementRows}</div>`:''}${item.limitations?`<p class="small"><b>Limitations:</b> ${esc(item.limitations)}</p>`:''}</article>`}).join('')}
function reportDocument(r){
 if(!r)return '';
 const generated=r.generated_at?new Date(r.generated_at).toLocaleString():new Date().toLocaleString();
 if(r.report_type==='evidence_summary') return `<section class="report-document"><div class="report-header"><div><div class="report-kicker">DEEPTRACE · FORENSIC CASE FILE</div><h2>Evidence Summary</h2><p>Generated ${esc(generated)}</p></div><div class="report-score"><span>Priority</span><b>${esc(r.investigation_priority_score)}</b></div></div><div class="report-grid"><div><label>Case</label><strong>${esc(r.title)}</strong></div><div><label>Case ID</label><strong class="mono">${esc(r.case_id)}</strong></div><div><label>Officer</label><strong>${esc(r.officer)}</strong></div><div><label>Evidence file</label><strong>${esc(r.evidence?.filename)}</strong></div><div><label>SHA-256</label><strong class="mono hash">${esc(r.evidence?.sha256)}</strong></div><div><label>File size</label><strong>${esc(formatBytes(r.evidence?.file_size))}</strong></div></div><h3>Analysis findings</h3><div class="report-findings">${reportFindingRows(r.findings)}</div><div class="report-note"><b>Important:</b> ${esc(r.important_note)}</div></section>`;
 if(r.report_type==='investigation_brief') return `<section class="report-document"><div class="report-header"><div><div class="report-kicker">DEEPTRACE · INTERNAL USE</div><h2>Investigation Brief</h2><p>Generated ${esc(generated)}</p></div><div class="report-score"><span>Priority</span><b>${esc(r.investigation_priority_score)}</b></div></div><div class="report-grid"><div><label>Case</label><strong>${esc(r.title)}</strong></div><div><label>Case ID</label><strong class="mono">${esc(r.case_id)}</strong></div><div><label>Officer</label><strong>${esc(r.officer)}</strong></div><div><label>Evidence SHA-256</label><strong class="mono hash">${esc(r.evidence_hash)}</strong></div></div><div class="report-section"><h3>Summary</h3><p>${esc(r.summary)}</p></div><h3>Module findings</h3><div class="report-findings">${reportFindingRows(r.findings)}</div><div class="report-note"><b>Limitation:</b> ${esc(r.limitations)}</div></section>`;
 if(r.report_type==='victim_guide') return `<section class="report-document"><div class="report-header"><div><div class="report-kicker">DEEPTRACE · GUIDANCE</div><h2>Evidence Preservation &amp; Reporting Guide</h2><p>Generated ${esc(generated)}</p></div></div><div class="report-grid"><div><label>Case</label><strong>${esc(r.title)}</strong></div><div><label>Case ID</label><strong class="mono">${esc(r.case_id)}</strong></div><div><label>Evidence SHA-256</label><strong class="mono hash">${esc(r.evidence_hash)}</strong></div></div><h3>Recommended steps</h3><ol class="report-list">${(r.guidance||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>${r.important_note?`<div class="report-note"><b>Important:</b> ${esc(r.important_note)}</div>`:''}</section>`;
 return `<section class="report-document"><div class="report-header"><div><div class="report-kicker">DEEPTRACE · FORENSIC CASE FILE</div><h2>${esc(reportTypeLabel(r.report_type))}</h2><p>Generated ${esc(generated)}</p></div></div><div class="report-section"><h3>Case summary</h3><p><b>Case:</b> ${esc(r.title||'—')}</p><p><b>Case ID:</b> <span class="mono">${esc(r.case_id||'—')}</span></p><p><b>Officer:</b> ${esc(r.officer||'—')}</p><p><b>Priority:</b> ${esc(r.investigation_priority_score??'—')}</p></div><h3>Findings</h3><div class="report-findings">${reportFindingRows(r.findings||[])}</div><div class="report-note"><b>Note:</b> Automated indicators are screening aids and require human forensic review.</div></section>`;
}
function formatBytes(n){if(n==null||n==='')return '—';const x=Number(n);if(!Number.isFinite(x))return String(n);if(x<1024)return `${x} B`;if(x<1048576)return `${(x/1024).toFixed(1)} KB`;if(x<1073741824)return `${(x/1048576).toFixed(2)} MB`;return `${(x/1073741824).toFixed(2)} GB`}
function reportsView(){const types=[['evidence-summary','Generate evidence summary','Facts and module results for the case file'],['investigation-brief','Generate internal brief','Short handover for a supervisor or examiner'],['victim-guide','Generate victim guide','Plain-language next steps for the affected person']];return `<h1>Investigation reports</h1><p class="sub">Choose a report to generate from the stored case, evidence and latest analysis.</p><div class="big">${types.map(([k,t,d])=>`<button class="btn big-b ${state.report?.report_type===k.replace('-','_')?'on':''}" data-report="${k}"><b>${t}</b><span>${d}</span></button>`).join('')}</div>${state.report?reportDocument(state.report):''}${state.error?`<p class="err">${esc(state.error)}</p>`:''}<div class="row"><button class="btn alt" id="backAnalysis">Back to analysis</button></div>`}
function wire(){
 $('#start')?.addEventListener('click',()=>{state.officer.name=$('#officer').value;state.officer.dept=$('#dept').value;if(!state.officer.name.trim())return setError(new Error('Enter the officer name to continue.'));go(1)});
 $('#create')?.addEventListener('click',async()=>{try{state.caseInfo.title=$('#title').value;state.officer.name=$('#caseOfficer').value;state.caseInfo.type=$('#type').value;if(!state.caseInfo.title.trim()||!state.officer.name.trim())throw Error('Enter the case title and officer name.');state.busy=true;render();const r=await api('/cases',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:state.caseInfo.title,officer:state.officer.name,evidence_type:state.caseInfo.type.toLowerCase()})});state.caseInfo.id=r.case_id;state.busy=false;go(2)}catch(e){state.busy=false;setError(e)}});
 const fileInput=$('#file'),drop=$('#drop');fileInput?.addEventListener('change',()=>choose(fileInput.files[0]));drop?.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over')});drop?.addEventListener('dragleave',()=>drop.classList.remove('over'));drop?.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');choose(e.dataTransfer.files[0])});
 $('#upload')?.addEventListener('click',upload);
 document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>{state.activeModule=moduleData().findIndex(x=>x[0]===b.dataset.module);go(4)});
 $('#findings')?.addEventListener('click',()=>go(4));document.querySelectorAll('#reports').forEach(b=>b.onclick=()=>go(5));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.activeModule=+b.dataset.tab;render()});$('#backAnalysis')?.addEventListener('click',()=>go(3));
 document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>generateReport(b.dataset.report));
}
function choose(f){if(!f)return;const ext=f.name.split('.').pop().toLowerCase();if(!allowed[state.caseInfo.type].includes(ext))return setError(new Error(`Unsupported file. Use ${allowed[state.caseInfo.type].join(', ').toUpperCase()}.`));state.file=f;state.error='';render()}
async function upload(){try{state.busy=true;render();const fd=new FormData();fd.append('file',state.file);state.evidence=await api(`/cases/${encodeURIComponent(state.caseInfo.id)}/evidence`,{method:'POST',body:fd});state.analysis=await api(`/cases/${encodeURIComponent(state.caseInfo.id)}/analyze`,{method:'POST'});state.busy=false;go(3)}catch(e){state.busy=false;setError(e)}}
async function generateReport(kind){try{state.error='';state.report=await api(`/cases/${encodeURIComponent(state.caseInfo.id)}/reports/${kind}`,{method:'POST'});render()}catch(e){setError(e)}}
render();
</script></body></html>
